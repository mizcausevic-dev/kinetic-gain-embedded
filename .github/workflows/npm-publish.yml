name: npm-publish

# Publishes to npm on every v* tag push (e.g. v0.1.1, v1.0.0, v1.0-prod).
# Also supports manual dispatch with an explicit version (no tag required).
#
# Setup once: add NPM_TOKEN secret to the repo (Settings → Secrets → Actions).
# The token must be an "Automation" type token (bypasses 2FA at publish time).
# See: https://docs.npmjs.com/creating-and-viewing-access-tokens
#
# Safety: this workflow runs ONLY on tags or manual dispatch. Push-to-main
# never triggers a publish. The `prepublishOnly` script (in package.json)
# additionally re-runs clean + build + test before npm publish actually
# uploads — a final pre-flight gate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack-only dry run (don't publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needs write to attach SBOM artifact to the GitHub Release
      id-token: write   # enables npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so npm provenance can link to commit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Typecheck + tests (pre-flight)
        run: |
          npm run typecheck
          npm test

      - name: Build dual ESM/CJS
        run: npm run build

      - name: ESM smoke
        run: node -e "import('./dist/esm/index.js').then(m => { if (!m.AuditStream) throw new Error('AuditStream not exported from ESM'); console.log('ESM OK'); })"

      - name: CJS smoke
        run: node -e "const m = require('./dist/cjs/index.cjs'); if (!m.AuditStream) throw new Error('AuditStream not exported from CJS'); console.log('CJS OK');"

      - name: npm pack (dry-run preview)
        run: npm pack --dry-run

      - name: Generate CycloneDX SBOM (Software Bill of Materials)
        run: |
          # The package has zero runtime deps by design, but devDeps still
          # appear in the build tree. We generate both views so downstream
          # consumers + auditors have full transparency. CycloneDX 1.5 is
          # the most-supported format in 2026 (SPDX-3 still rolling out).
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --sbom-type library > sbom/cyclonedx.json
          echo "Generated SBOM:"
          node -e "const s=require('./sbom/cyclonedx.json'); console.log('  format:', s.bomFormat, s.specVersion); console.log('  components:', (s.components||[]).length); console.log('  serial:', s.serialNumber);"

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach SBOM to GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Create the release if it doesn't already exist (publish.yml fires
          # on tag push before the human-created release), or upload to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom/cyclonedx.json --clobber
          else
            gh release create "$TAG" sbom/cyclonedx.json --title "$TAG" --notes "See CHANGELOG.md. SBOM attached (CycloneDX 1.5)."
          fi
