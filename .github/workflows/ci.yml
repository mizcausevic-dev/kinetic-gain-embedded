name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only test runs. GITHUB_TOKEN gets no write to
# anything (contents, packages, issues, PRs, actions). The npm publish
# flow lives in npm-publish.yml with its own scoped permissions.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --no-audit --no-fund
      # Supply-chain: fail CI on ANY advisory affecting a PRODUCTION
      # dependency. KGE ships with zero runtime deps, so this gate is
      # effectively "if you ever add a runtime dep with a known CVE, the
      # build fails." Dev-only advisories (vitest, tsx, typescript build
      # chain) are left to scheduled dependabot — they never ship to
      # users so they're a different risk class. Note --audit-level=info
      # = strictest; --omit=dev = filter to prod-only.
      - name: npm audit (production deps only, any severity)
        run: npm audit --omit=dev --audit-level=info
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: ESM smoke
        run: node -e "import('./dist/esm/index.js').then(m => { if (!m.AuditStream) throw new Error('AuditStream not exported'); console.log('ESM OK'); })"
      - name: CJS smoke
        run: node -e "const m = require('./dist/cjs/index.cjs'); if (!m.AuditStream) throw new Error('AuditStream not exported'); console.log('CJS OK');"
      - name: Standalone demo
        run: node examples/standalone/demo.mjs
